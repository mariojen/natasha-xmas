<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natasha's Christmas Countdown</title>
<meta name="description" content="Counting down to julafton.">
<meta name="theme-color" content="#0f1a2b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ========= EDIT ME ========= */
  /* Text lives in the CONFIG block in the <script> at the bottom. */

  :root {
    --night: #0f1a2b;
    --night-2: #16253b;
    --ink: #f4efe6;
    --muted: #a9b4c4;
    --gold: #e8c27a;
    --red: #c8443c;
    --card: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -10%, #23395a 0%, var(--night-2) 45%, var(--night) 100%) fixed;
    background-color: var(--night);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  main {
    position: relative; z-index: 1;
    max-width: 720px; margin: 0 auto;
    padding: clamp(40px, 9vh, 96px) 16px 48px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 36px;
  }

  .eyebrow {
    font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--gold);
  }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 300;
    font-size: clamp(38px, 9vw, 68px); line-height: 1.05;
    margin-top: 12px;
  }
  h1 em { font-style: italic; font-weight: 600; color: var(--gold); }

  .clock {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: clamp(8px, 2.5vw, 16px); width: 100%;
  }
  .unit {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 18px; padding: clamp(14px, 3.5vw, 24px) 4px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .num {
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-size: clamp(34px, 10vw, 64px); line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .lbl {
    margin-top: 8px; font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--muted);
  }

  .candles { display: flex; gap: clamp(18px, 6vw, 36px); align-items: flex-end; justify-content: center; }
  .candle { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .flame {
    width: 12px; height: 20px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 50% 70%, #fff6d6 0%, #ffd27a 45%, #ff8a3d 80%, transparent 100%);
    opacity: 0; transform-origin: 50% 100%;
    filter: drop-shadow(0 0 8px rgba(255,190,90,0.8));
    transition: opacity 0.6s;
  }
  .candle.lit .flame { opacity: 1; animation: flicker 2.4s infinite ease-in-out; }
  .stick { width: 16px; height: 52px; border-radius: 3px; background: linear-gradient(#f3ece0, #d9cfbf); }
  .candle.lit .stick { box-shadow: 0 -10px 24px rgba(255,190,90,0.25); }
  .candles, .candles .stick, #adventText { transition: opacity .6s, transform .6s, height .6s, font-size .6s; }
  .candles.waiting { opacity: 0.45; gap: clamp(12px, 4vw, 22px); margin-top: -12px; }
  .candles.waiting .stick { width: 10px; height: 28px; }
  .candles.waiting span { display: none; }
  #adventText.waiting { font-size: 13px; opacity: 0.7; margin-top: -24px; }
  .candle span { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
  @keyframes flicker {
    0%,100% { transform: scale(1) rotate(-1deg); }
    40% { transform: scale(1.06, 0.95) rotate(2deg); }
    70% { transform: scale(0.96, 1.05) rotate(-2deg); }
  }

  .note {
    width: 100%; background: var(--card); border: 1px solid var(--card-border);
    border-radius: 18px; padding: 22px 20px; text-align: left;
  }
  .note h2 {
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--gold); font-weight: 500; margin-bottom: 10px;
  }
  .note p { font-family: "Fraunces", Georgia, serif; font-size: 20px; line-height: 1.45; font-weight: 300; }

  .sub { color: var(--muted); font-size: 15px; line-height: 1.5; }
  footer { color: var(--muted); font-size: 13px; opacity: 0.8; }

  /* ----- Growing tree scene ----- */
  .scene { width: 100%; max-width: 300px; margin: -12px auto -10px; }
  .scene svg { width: 100%; height: auto; display: block; overflow: visible; }
  .scene-cap { margin-top: 4px; font-size: 15px; line-height: 1.4; color: var(--ink); }
  .scene-day {
    display: inline-block; margin-right: 6px; font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--gold); font-weight: 500;
  }
  .scene-since { margin-top: 4px; font-size: 12px; color: var(--muted); min-height: 1em; }
  .scene .spark, .scene .new { transform-box: fill-box; transform-origin: center; animation: pop 1.8s ease-in-out infinite; }
  .scene .smoke { animation: smoke 4s ease-in-out infinite; }
  @keyframes smoke { 0%,100% { transform: translateY(0); opacity: .35; } 50% { transform: translateY(-3px); opacity: .15; } }
  .scene .bulb { animation: blink 2.6s ease-in-out infinite; }
  .scene .glow { filter: drop-shadow(0 0 5px rgba(255,210,120,0.9)); }
  .scene .fall { transform-box: fill-box; transform-origin: center; animation: fall 7s linear infinite; }
  @keyframes pop { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.35); opacity: 0.75; } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes fall { 0% { transform: translate(0,0) rotate(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translate(-14px,60px) rotate(220deg); opacity: 0; } }

  .celebrate h1 { font-size: clamp(48px, 13vw, 96px); }
  @media (prefers-reduced-motion: reduce) {
    .candle.lit .flame { animation: none; }
    .scene .spark, .scene .new, .scene .bulb, .scene .fall, .scene .smoke { animation: none; }
  }
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>

<main id="app">
  <header>
    <div class="eyebrow" id="eyebrow">For Natasha</div>
    <h1 id="title">Counting down to <em>julafton</em></h1>
  </header>

  <section class="scene" aria-label="Today's tree">
    <svg id="tree" viewBox="0 0 240 172" role="img" aria-label="A little Christmas tree growing day by day"></svg>
    <div class="scene-cap" id="sceneCap"></div>
    <div class="scene-since" id="sceneSince"></div>
  </section>

  <section class="clock" id="clock" aria-live="polite">
    <div class="unit"><div class="num" id="d">--</div><div class="lbl">Days</div></div>
    <div class="unit"><div class="num" id="h">--</div><div class="lbl">Hours</div></div>
    <div class="unit"><div class="num" id="m">--</div><div class="lbl">Minutes</div></div>
    <div class="unit"><div class="num" id="s">--</div><div class="lbl">Seconds</div></div>
  </section>

  <section class="candles" id="candles" aria-label="Advent candles"></section>
  <p class="sub" id="adventText"></p>


  <section class="note">
    <h2 id="noteTitle">Today's note</h2>
    <p id="noteText"></p>
  </section>

  <footer id="footer">With love, Jens</footer>
</main>

<script>
/* ================= CONFIG — edit freely ================= */
const CONFIG = {
  name: "Natasha",
  signature: "With love, Jens",
  // Main day: Swedish Christmas Eve. Change to 25 if you prefer Christmas Day.
  month: 12, day: 24,
  // Shown before December (rotates daily)
  waitingNotes: [
    "Glögg season is getting closer.",
    "Somewhere, a lussekatt is already dreaming of saffron.",
    "Start thinking about which Christmas film comes first this year.",
    "The days are getting darker — the candles will fix that.",
    "Good things are worth the wait. So are you."
  ],
  // One note per December day, 1–24. Replace with your own little messages.
  decemberNotes: [
    "December's here. Let the countdown get serious.",
    "Advent calendar check: one door at a time.",
    "Perfect night for something warm and a blanket.",
    "Pepparkakor count as dinner this month. Probably.",
    "Pick tonight's Christmas song. Your choice, no vetoes.",
    "A slow morning is a gift too.",
    "Let's put up one more string of lights.",
    "Glögg o'clock, wherever you are.",
    "Something sweet is hiding somewhere. Go look.",
    "Halfway through the first part of the wait.",
    "Tonight: no screens, just candles.",
    "Thank you for making this home feel like Christmas.",
    "Lucia morning — saffron and singing.",
    "Ten days of countdown left. You're doing great.",
    "Wrapping paper amnesty: we'll find the tape.",
    "Hot chocolate, extra marshmallows. That's the rule.",
    "One week to go.",
    "Count the windows with stars in them on your walk.",
    "The kids are probably more excited than both of us.",
    "Fourth candle territory.",
    "Shortest day of the year — it only gets lighter from here.",
    "Two more sleeps.",
    "Dopparedagen eve. Almost there.",
    "God Jul, " + "Natasha" + ". ❤️"
  ],
  // Shown on the 24th–26th
  celebrateTitle: "God Jul",
  celebrateText: "It's here. Merry Christmas — love you."
};
/* ======================================================== */

const $ = id => document.getElementById(id);
$("eyebrow").textContent = "For " + CONFIG.name;
$("footer").textContent = CONFIG.signature;

function target(now) {
  let y = now.getFullYear();
  const t = new Date(y, CONFIG.month - 1, CONFIG.day, 0, 0, 0);
  // Keep celebrating through Dec 26, then roll to next year
  const endCelebrate = new Date(y, CONFIG.month - 1, CONFIG.day + 3, 0, 0, 0);
  if (now >= endCelebrate) return new Date(y + 1, CONFIG.month - 1, CONFIG.day);
  return t;
}

function adventSundays(year) {
  const xmasEve = new Date(year, 11, 24);
  const fourth = new Date(year, 11, 24 - xmasEve.getDay()); // Sunday on/before Dec 24
  return [21, 14, 7, 0].map(off => new Date(fourth.getFullYear(), fourth.getMonth(), fourth.getDate() - off));
}

const ord = ["First", "Second", "Third", "Fourth"];
function renderCandles(now) {
  const sundays = adventSundays(now.getMonth() >= 11 || now.getMonth() < 1 ? now.getFullYear() : now.getFullYear());
  const lit = sundays.filter(s => now >= s).length;
  const wrap = $("candles");
  wrap.innerHTML = "";
  wrap.classList.toggle("waiting", lit === 0);
  $("adventText").classList.toggle("waiting", lit === 0);
  sundays.forEach((s, i) => {
    const c = document.createElement("div");
    c.className = "candle" + (i < lit ? " lit" : "");
    c.innerHTML = '<div class="flame"></div><div class="stick"></div><span>' + (i + 1) + '</span>';
    wrap.appendChild(c);
  });
  const fmt = d => d.toLocaleDateString("en-GB", { day: "numeric", month: "long" });
  if (lit === 0) $("adventText").textContent = "First Advent candle gets lit on " + fmt(sundays[0]) + ".";
  else if (lit < 4) $("adventText").textContent = ord[lit - 1] + " Advent. Next candle on " + fmt(sundays[lit]) + ".";
  else $("adventText").textContent = "All four candles are lit.";
}

function renderNote(now) {
  const m = now.getMonth(), d = now.getDate();
  if (m === 11 && d <= 24) {
    $("noteTitle").textContent = d + " December";
    $("noteText").textContent = CONFIG.decemberNotes[d - 1] || "";
  } else {
    const dayIndex = Math.floor(now / 86400000);
    $("noteTitle").textContent = "Today's note";
    $("noteText").textContent = CONFIG.waitingNotes[dayIndex % CONFIG.waitingNotes.length];
  }
}

/* ================= Growing tree =================
   Planted 9 Oct, grows until first Advent, then one decoration a day.
   Preview any day with ?date=YYYY-MM-DD                                */
const qs = new URLSearchParams(location.search);
const PREVIEW = /^\d{4}-\d{2}-\d{2}$/.test(qs.get("date") || "");
function getNow() {
  const real = new Date();
  if (!PREVIEW) return real;
  const [y, m, d] = qs.get("date").split("-").map(Number);
  return new Date(y, m - 1, d, real.getHours(), real.getMinutes(), real.getSeconds());
}
const dayDiff = (a, b) => Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

const DECOS = [ // one per day, 1–23 December: [shape, colour, name]
  ["bauble", "#c8443c", "a red bauble"], ["goat", 0, "a little straw goat"], ["heart", "#d94f6b", "a red heart"],
  ["bauble", "#e8c27a", "a gold bauble"], ["cane", 0, "a candy cane"], ["ginger", 0, "a gingerbread friend"],
  ["dala", "#c8443c", "a Dala horse"], ["bauble", "#5b8fd1", "a blue bauble"], ["bell", "#e8c27a", "a little bell"],
  ["star", "#f3ece0", "a white star"], ["heart", "#e8c27a", "a woven gold heart"], ["bauble", "#f3ece0", "a snow-white bauble"],
  ["lussekatt", 0, "a lussekatt, for Lucia"], ["goat", 0, "another straw goat"], ["bauble", "#c8443c", "a red bauble"],
  ["cane", 0, "a candy cane"], ["dala", "#5b8fd1", "a blue Dala horse"], ["ginger", 0, "a second gingerbread friend"],
  ["bell", "#dfe6ee", "a silver bell"], ["bauble", "#e8c27a", "a gold bauble"], ["heart", "#c8443c", "a felt heart"],
  ["star", "#e8c27a", "a little gold star"], ["bauble", "#7aa86a", "a green glass bauble"]
];
const VISITORS = { "10-17": "hedgehog", "10-30": "hedgehog", "11-08": "bullfinch", "11-22": "bullfinch", "12-06": "tomte", "12-18": "tomte" };
const VISIT_CAPS = {
  hedgehog: ["A hedgehog stopped by before its winter nap.", "The hedgehog came back to say goodnight until spring."],
  bullfinch: ["A bullfinch is visiting the branches.", "The bullfinch is back, puffed up against the cold."]
};
const GROW_CAPS = [
  "Grew a little taller overnight.", "Roots digging in for winter.", "Soaking up what little daylight there is.",
  "Reaching for the moonlight.", "A few more needles today.", "Standing a bit prouder today.",
  "Quietly growing in the dark.", "A little fuller around the middle.", "Stretching towards the stars.",
  "Growing while you sleep."
];

function sceneState(date) {
  const Y = target(date).getFullYear();
  const plant = new Date(Y, 9, 9), adv1 = adventSundays(Y)[0];
  const d = dayDiff(plant, date), growDays = dayDiff(plant, adv1);
  const md = date.getMonth(), dd = date.getDate();
  const s = { d, date, adv1 };
  s.phase = d < 0 ? "empty" : d < 3 ? "seed" : d < 7 ? "sprout" : "tree";
  const tgAt = x => Math.max(0, Math.min(1, (x - 7) / (growDays - 7)));
  s.tg = tgAt(d);
  s.tiers = Math.min(5, 1 + Math.floor(s.tg * 4.999));
  s.prevTiers = Math.min(5, 1 + Math.floor(tgAt(d - 1) * 4.999));
  s.leaves = md === 9;
  const sd = dayDiff(new Date(Y, 10, 15), date);
  s.snow = sd < 0 ? 0 : Math.min(1, (sd + 1) / 26);
  s.firstSnow = sd === 0;
  s.frost = dayDiff(new Date(Y, 10, 1), date) >= 0;
  s.firstFrost = md === 10 && dd === 1;
  s.lights = dayDiff(adv1, date) >= 0;
  s.isAdv1 = dayDiff(adv1, date) === 0;
  const suns = adventSundays(Y);
  s.candlesLit = suns.filter(x => dayDiff(x, date) >= 0).length;
  s.adventToday = suns.findIndex(x => dayDiff(x, date) === 0) + 1; // 0 = not an Advent Sunday
  const decDay = md === 11 ? dd : 0;
  s.decos = Math.min(23, decDay);
  s.newDeco = decDay >= 1 && decDay <= 23;
  s.star = s.gifts = decDay >= 24;
  s.visitor = VISITORS[String(md + 1).padStart(2, "0") + "-" + String(dd).padStart(2, "0")] || null;
  s.visitN = s.visitor ? Object.entries(VISITORS).filter(([k, v]) => v === s.visitor && k < ymd(date).slice(5)).length : 0;
  return s;
}

function sceneCaption(s) {
  if (s.phase === "empty") return "A new seed gets planted on 9 October.";
  if (s.star) return "The star is on top. God Jul! ⭐";
  if (s.adventToday === 3 && s.newDeco && DECOS[s.decos - 1][0] === "lussekatt") return "Third Advent and Lucia: a candle is lit, and a lussekatt for the tree.";
  if (s.adventToday >= 2 && s.newDeco) return ["", "", "Second", "Third", "Fourth"][s.adventToday] + " Advent: another candle is lit. New on the tree: " + DECOS[s.decos - 1][2] + ".";
  if (s.newDeco) return "New today: " + DECOS[s.decos - 1][2] + "." + (s.visitor === "tomte" ? " And someone's peeking…" : "");
  if (s.isAdv1) return "Fully grown, and the lights are on. Första advent!";
  if (s.visitor && VISIT_CAPS[s.visitor]) return VISIT_CAPS[s.visitor][Math.min(s.visitN, 1)];
  if (s.phase === "seed") return ["A tiny seed has been planted.", "The seed is resting in the soil.", "Something is stirring underground…"][s.d];
  if (s.phase === "sprout") return ["The first sprout! 🌱", "Two little leaves, reaching for the light.", "The sprout stood up a little taller.", "The first needles are appearing."][s.d - 3];
  if (s.firstFrost) return "First frost on the ground.";
  if (s.firstSnow) return "First snow! ❄️";
  if (s.tiers > s.prevTiers) return "A new tier of branches!";
  return GROW_CAPS[s.d % GROW_CAPS.length];
}

// Fixed, pleasing spots for the 23 decorations (seeded, so always the same)
const SLOTS = (() => {
  let a = 7; const rnd = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const out = [], H = 130, W = 104;
  while (out.length < 23) {
    for (let i = 0; i < 400; i++) {
      const t = 0.2 + rnd() * 0.76, sx = (rnd() * 2 - 1) * 0.78;
      const x = sx * W / 2 * t * 0.85, y = t * H;
      if (out.every(p => Math.hypot(p.x - x, p.y - y) > 13.5 - i / 60)) { out.push({ t, sx, x, y }); break; }
    }
  }
  return out;
})();

function decoSVG(type, col, x, y, cls) {
  const big = ["dala", "goat", "lussekatt"].includes(type) ? " scale(1.5)" : "";
  const g = (inner) => `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})${big}"><g class="${cls || ""}">${inner}</g></g>`;
  switch (type) {
    case "bauble": return g(`<rect x="-1.2" y="-5.6" width="2.4" height="1.8" fill="#d9c08a"/><circle r="4.2" fill="${col}"/><circle cx="-1.4" cy="-1.4" r="1.1" fill="#fff" opacity=".55"/>`);
    case "heart": return g(`<path d="M0,3.6 C-5.6,-0.6 -3.4,-5.4 0,-2.6 C3.4,-5.4 5.6,-0.6 0,3.6Z" fill="${col}"/>`);
    case "goat": return g(`<path d="M-4,0 L3,0 M-3,0 L-3.6,4 M-1.4,0 L-1.6,4 M1.4,0 L1.6,4 M3,0 L3.4,4 M3,0 L4.6,-3 C5.6,-5.2 3.2,-5.6 3.7,-3.4" stroke="#e3c27a" stroke-width="1.15" fill="none" stroke-linecap="round"/><circle cx="3.6" cy="-1.4" r=".9" fill="#c8443c"/>`);
    case "cane": return g(`<path d="M1.6,5 L1.6,-1.8 A2.3,2.3 0 0 0 -3,-1.8" stroke="#f6f1e8" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M1.6,5 L1.6,-1.8 A2.3,2.3 0 0 0 -3,-1.8" stroke="#c8443c" stroke-width="2" fill="none" stroke-dasharray="1.3 1.3"/>`);
    case "ginger": return g(`<ellipse cy="0.8" rx="4.4" ry="1.3" fill="#b8743a"/><ellipse cy="1.8" rx="2.5" ry="3.2" fill="#b8743a"/><circle cy="-2.8" r="2" fill="#b8743a"/><circle cy="1" r=".45" fill="#fff"/><circle cy="2.6" r=".45" fill="#fff"/>`);
    case "dala": return g(`<path d="M-4.2,3.4 L-3.6,-0.6 L1.8,-0.6 L3,-3.8 L4.8,-3.2 L4.2,0 L3.6,3.4 L2.4,3.4 L2.4,1 L-2.4,1 L-2.8,3.4Z" fill="${col}"/><path d="M-2.4,0.2 Q0,-1.4 1.8,0.2" stroke="#e8c27a" stroke-width=".6" fill="none"/>`);
    case "bell": return g(`<path d="M-3.6,2.6 C-3.6,-2 -2,-4.2 0,-4.2 C2,-4.2 3.6,-2 3.6,2.6Z" fill="${col}"/><circle cy="3.2" r="1" fill="#c8443c"/>`);
    case "star": return g(starPath(0, 0, 4.4, col));
    case "lussekatt": return g(`<path d="M-0.8,0 C-0.8,-3.4 -5.2,-3.2 -4.6,0 C-4.1,2.2 -1.6,1.8 -1.6,0 M0.8,0 C0.8,3.4 5.2,3.2 4.6,0 C4.1,-2.2 1.6,-1.8 1.6,0 M-1.6,0 L1.6,0" stroke="#e0a63a" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="-2.9" cy="-0.1" r=".8" fill="#3a1f14"/><circle cx="2.9" cy="0.1" r=".8" fill="#3a1f14"/>`);
  }
  return "";
}
function starPath(cx, cy, r, col, cls) {
  let p = "";
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; p += (i ? "L" : "M") + (cx + rr * Math.cos(a)).toFixed(2) + "," + (cy + rr * Math.sin(a)).toFixed(2); }
  return `<path class="${cls || ""}" d="${p}Z" fill="${col}"/>`;
}
const sparkle = (x, y, k) => { const r = 5 * Math.max(0.55, k), q = r * 0.24; return `<path class="spark" d="M${x},${y - r} L${x + q},${y - q} L${x + r},${y} L${x + q},${y + q} L${x},${y + r} L${x - q},${y + q} L${x - r},${y} L${x - q},${y - q}Z" fill="#fff6d6"/>`; };

function drawScene(s) {
  const cx = 120, base = 149;
  let back = "", mid = "", front = "", fx = cx, fy = 140;
  // Camera: zoom in on a small plant, pull back as it grows
  const plantH = s.phase === "seed" ? 8 : s.phase === "sprout" ? 12 + (s.d - 3) * 4.5 : s.phase === "tree" ? 24 + 106 * s.tg : 40;
  const vh = Math.min(172, Math.max(64, plantH / 0.62 + 18)), vw = vh * 240 / 172, k = vh / 172;
  const vb = [cx - vw / 2, base + 23 * k - vh, vw, vh];
  const hillY = x => { const t = x / 240; return 163 - 28 * 2 * t * (1 - t); };

  // Ground
  let ground = `<path d="M0,172 L0,163 Q120,135 240,163 L240,172Z" fill="url(#hillG)"/>`;
  if (s.frost && s.snow < 0.35) for (let i = 0; i < 22; i++) { const x = 14 + i * 9.7 + (i * 37 % 5); ground += `<circle cx="${x}" cy="${(hillY(x) + 1.5 + (i * 13 % 4)).toFixed(1)}" r=".75" fill="#dfe9f5" opacity=".75"/>`; }
  if (s.snow > 0) ground += `<path d="M0,163 Q120,135 240,163" stroke="#eef3f8" stroke-width="${(1.5 + s.snow * 6).toFixed(1)}" fill="none" opacity=".95"/>`;
  if (s.leaves) {
    [[40, "#c8743c", 30], [78, "#d9a441", -20], [158, "#a8432f", 50], [190, "#d9a441", 10], [205, "#c8743c", -40]].forEach(([x, c, r]) => {
      ground += `<ellipse cx="${x}" cy="${(hillY(x) + 1).toFixed(1)}" rx="3" ry="1.5" fill="${c}" transform="rotate(${r} ${x} ${hillY(x) + 1})"/>`;
    });
    const lx1 = vb[0] + vb[2] * 0.78, lx2 = vb[0] + vb[2] * 0.2, ly = vb[1] + vb[3] * 0.25, ls = Math.max(0.6, k);
    mid += `<ellipse class="fall" cx="${lx1}" cy="${ly}" rx="${2.8 * ls}" ry="${1.4 * ls}" fill="#d9a441"/><ellipse class="fall" style="animation-delay:-3.5s" cx="${lx2}" cy="${ly - 6 * k}" rx="${2.8 * ls}" ry="${1.4 * ls}" fill="#c8743c"/>`;
  }
  if (s.phase === "seed" || s.phase === "sprout") ground += `<ellipse cx="${cx}" cy="${base + 1.5}" rx="15" ry="3.6" fill="#2b2420"/>`;

  // Plant
  if (s.phase === "seed") {
    mid += `<ellipse cx="${cx}" cy="${base}" rx="3.3" ry="2.3" fill="#8a5a3b"/>`;
    if (s.d === 2) mid += `<path d="M${cx - 1},${base - 2} L${cx},${base - 0.4} L${cx + 1},${base - 2}" stroke="#c9a27a" stroke-width=".6" fill="none"/><path d="M${cx},${base - 2.2} L${cx},${base - 4.5}" stroke="#8cc56f" stroke-width="1.2" stroke-linecap="round"/>`;
    fx = cx; fy = base - 8;
  } else if (s.phase === "sprout") {
    const h = 7 + (s.d - 3) * 4.5, ty = base - h;
    mid += `<path d="M${cx},${base} Q${cx - 2.5},${base - h / 2} ${cx},${ty}" stroke="#7fb069" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    mid += `<ellipse cx="${cx - 4}" cy="${ty + 0.5}" rx="4.2" ry="1.9" fill="#8cc56f" transform="rotate(-28 ${cx - 4} ${ty + 0.5})"/><ellipse cx="${cx + 4}" cy="${ty + 0.5}" rx="4.2" ry="1.9" fill="#8cc56f" transform="rotate(28 ${cx + 4} ${ty + 0.5})"/>`;
    if (s.d === 6) mid += `<path d="M${cx},${ty - 6} L${cx + 2.6},${ty} L${cx - 2.6},${ty}Z" fill="#3d7a60"/>`;
    fx = cx; fy = ty - 9;
  } else if (s.phase === "tree") {
    const H = 24 + 106 * s.tg, W = H * 0.8, n = s.tiers;
    const trunkH = Math.max(5, H * 0.1), trunkW = Math.max(3, H * 0.07);
    const apex = base - H, fb = base - trunkH, fh = fb - apex;
    mid += `<rect x="${cx - trunkW / 2}" y="${fb - 2}" width="${trunkW}" height="${trunkH + 2}" rx="1" fill="#5a3d2b"/>`;
    const hwAt = t => W / 2 * t * 0.85;
    for (let i = n - 1; i >= 0; i--) {
      const yb = apex + fh * (i + 1) / n, yt = i === 0 ? apex : apex + fh * i / n - fh / n * 0.55;
      const hw = W / 2 * (0.35 + 0.65 * (i + 1) / n);
      mid += `<path d="M${cx},${yt.toFixed(1)} L${(cx + hw).toFixed(1)},${yb.toFixed(1)} Q${cx},${(yb + 4).toFixed(1)} ${(cx - hw).toFixed(1)},${yb.toFixed(1)}Z" fill="url(#treeG)"/>`;
      if (s.snow > 0.15) {
        mid += `<path d="M${(cx - hw).toFixed(1)},${yb.toFixed(1)} Q${cx},${(yb + 4).toFixed(1)} ${(cx + hw).toFixed(1)},${yb.toFixed(1)}" stroke="#eef3f8" stroke-width="${(1 + 1.6 * s.snow).toFixed(1)}" fill="none" stroke-linecap="round" opacity=".9"/>`;
        const k = 0.16; mid += `<path d="M${cx},${yt.toFixed(1)} L${(cx + hw * k).toFixed(1)},${(yt + (yb - yt) * k).toFixed(1)} L${(cx - hw * k).toFixed(1)},${(yt + (yb - yt) * k).toFixed(1)}Z" fill="#eef3f8" opacity=".9"/>`;
      }
    }
    if (s.lights) {
      const cols = ["#ffd27a", "#ff9a6a", "#fff3c4"]; let n2 = 0;
      [0.36, 0.6, 0.84].forEach(j => {
        for (let u = 0; u <= 1.001; u += 0.125) {
          const t = j - 0.07 + 0.14 * u + 0.05 * Math.sin(u * Math.PI);
          const x = cx + (u * 2 - 1) * hwAt(t) * 1.02, y = apex + t * fh;
          mid += `<circle class="bulb" style="animation-delay:${(-(n2 * 0.37) % 2.6).toFixed(2)}s" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.9" fill="${cols[n2++ % 3]}"/>`;
        }
      });
    }
    for (let i = 0; i < s.decos; i++) {
      const p = SLOTS[i], [type, col] = DECOS[i];
      const x = cx + p.sx * hwAt(p.t), y = apex + p.t * fh, isNew = s.newDeco && i === s.decos - 1;
      front += decoSVG(type, col, x, y, isNew ? "new" : "");
      if (isNew) { fx = x + 7; fy = y - 7; }
    }
    if (!s.newDeco) { fx = cx + 6; fy = apex - 5; }
    if (s.star) { front += `<g class="glow">${starPath(cx, apex - 1, 7.5, "#f1cf7f")}</g>`; fx = null; }
    if (s.gifts) {
      front += `<rect x="${cx - 38}" y="${base - 9}" width="13" height="9" rx="1" fill="#c8443c"/><rect x="${cx - 32.3}" y="${base - 9}" width="1.6" height="9" fill="#e8c27a"/><rect x="${cx - 38}" y="${base - 5.3}" width="13" height="1.6" fill="#e8c27a"/>`;
      front += `<rect x="${cx - 22}" y="${base - 7}" width="10" height="7" rx="1" fill="#f3ece0"/><rect x="${cx - 17.8}" y="${base - 7}" width="1.4" height="7" fill="#c8443c"/>`;
      front += `<rect x="${cx + 20}" y="${base - 10}" width="14" height="10" rx="1" fill="#e8c27a"/><rect x="${cx + 26.2}" y="${base - 10}" width="1.6" height="10" fill="#c8443c"/><rect x="${cx + 20}" y="${base - 5.8}" width="14" height="1.6" fill="#c8443c"/>`;
    }
    // Visitors
    if (s.visitor === "bullfinch") {
      const t = 0.5, bx = cx + hwAt(t) + 3, by = apex + t * fh - 3;
      front += `<g transform="translate(${bx} ${by}) scale(1.6) translate(${-bx} ${-by})"><circle cx="${bx}" cy="${by}" r="4.2" fill="#7b808b"/><circle cx="${bx + 1.2}" cy="${by + 1.2}" r="3.3" fill="#e2603f"/><circle cx="${bx + 2.6}" cy="${by - 3.2}" r="2.6" fill="#7b808b"/><path d="M${bx + 0.6},${by - 4.4} A2.6,2.6 0 0 1 ${bx + 5},${by - 3.6} L${bx + 3},${by - 2.8}Z" fill="#1d1d22"/><path d="M${bx + 5},${by - 3.2} L${bx + 6.8},${by - 2.6} L${bx + 5},${by - 2}Z" fill="#2a2a2a"/><circle cx="${bx + 3.4}" cy="${by - 3.1}" r=".45" fill="#000"/><path d="M${bx - 4},${by - 0.5} L${bx - 7},${by + 1.2} L${bx - 4},${by + 1.6}Z" fill="#3b3e46"/></g>`;
      fx = bx + 10; fy = by - 14;
    }
    if (s.visitor === "tomte") {
      const tx = cx + W / 2 * 0.72, ty = base + 1;
      front += `<g transform="translate(${tx} ${ty}) scale(1.55) translate(${-tx} ${-ty})"><rect x="${tx - 5}" y="${ty - 8}" width="10" height="8" rx="3" fill="#c8443c"/><circle cx="${tx}" cy="${ty - 11}" r="4" fill="#f2c9a8"/><path d="M${tx - 4.6},${ty - 11} Q${tx},${ty - 1} ${tx + 4.6},${ty - 11} Q${tx},${ty - 7.5} ${tx - 4.6},${ty - 11}Z" fill="#f6f3ee"/><path d="M${tx - 5},${ty - 13.5} L${tx + 1},${ty - 26} L${tx + 5},${ty - 13.5}Z" fill="#c8443c"/><circle cx="${tx + 1}" cy="${ty - 26}" r="1.6" fill="#f6f3ee"/><rect x="${tx - 5.4}" y="${ty - 14.6}" width="10.8" height="2.2" rx="1.1" fill="#f6f3ee"/><circle cx="${tx - 1.4}" cy="${ty - 11.6}" r=".5" fill="#2a1a12"/><circle cx="${tx + 1.6}" cy="${ty - 11.6}" r=".5" fill="#2a1a12"/><circle cx="${tx + 0.2}" cy="${ty - 10.2}" r=".9" fill="#e59b86"/></g>`;
    }
  }
  {
    const sx = vb[0] + vb[2] * 0.8, sy = hillY(sx) + 0.5, z = k * 1.05;
    let h = `<g transform="translate(${sx.toFixed(1)} ${sy.toFixed(1)}) scale(${z.toFixed(3)})">`;
    h += `<circle cx="6.5" cy="-7.5" r="13" fill="url(#winGlow)"/>`;
    h += `<rect x="7" y="-29" width="3.4" height="8" fill="#3a3f4a"/>`;
    if (s.frost) h += `<circle class="smoke" cx="8.7" cy="-32" r="2.2" fill="#c9d3e0" opacity=".35"/><circle class="smoke" style="animation-delay:-2s" cx="9.7" cy="-36" r="2.8" fill="#c9d3e0" opacity=".25"/>`;
    h += `<rect x="-15" y="-16" width="30" height="16" fill="#a8322b"/><rect x="-15" y="-16" width="30" height="16" fill="url(#plankG)" opacity=".35"/>`;
    h += `<rect x="-15.5" y="-16" width="1.8" height="16" fill="#f3ece0"/><rect x="13.7" y="-16" width="1.8" height="16" fill="#f3ece0"/>`;
    h += `<path d="M-18.5,-15 L0,-28 L18.5,-15Z" fill="#2b2f3a"/><rect x="-18.5" y="-16" width="37" height="1.6" fill="#f3ece0"/>`;
    if (s.snow > 0) h += `<path d="M-18.5,-15.4 L0,-28.4 L18.5,-15.4 L16,-15.4 L0,-26 L-16,-15.4Z" fill="#eef3f8" opacity="${Math.min(1, 0.3 + s.snow).toFixed(2)}"/>`;
    h += `<rect x="-10.5" y="-11" width="6" height="11" fill="#6b2420"/><rect x="-11" y="-11.5" width="7" height="1" fill="#f3ece0"/><circle cx="-5.8" cy="-5.5" r=".6" fill="#e8c27a"/>`;
    h += `<rect x="2.5" y="-12" width="8" height="7.5" fill="#ffd27a"/><path d="M6.5,-12 V-4.5 M2.5,-8.2 H10.5" stroke="#f3ece0" stroke-width="1"/><rect x="2" y="-12.5" width="9" height="8.5" fill="none" stroke="#f3ece0" stroke-width="1"/>`;
    if (s.lights) h += `<g class="glow">${starPath(6.5, -8.3, 3.2, "#fff3d0")}</g>`;
    h += `</g>`;
    back += h;
  }
  if (s.visitor === "hedgehog") {
    const hx = Math.round(cx - Math.max(22, (24 + 106 * s.tg) * 0.4 + 16)), hy = hillY(hx) - 3.5;
    front += `<g><path d="M${hx - 10},${hy + 3} Q${hx - 10},${hy - 7} ${hx},${hy - 7} Q${hx + 8},${hy - 7} ${hx + 9},${hy + 1} L${hx + 9},${hy + 3}Z" fill="#5e4230"/>`;
    for (let i = 0; i < 7; i++) { const a = Math.PI + i * Math.PI / 7.5 + 0.15, x1 = hx + Math.cos(a) * 8, y1 = hy + Math.sin(a) * 7 + 1; front += `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} l${(Math.cos(a) * 3).toFixed(1)},${(Math.sin(a) * 3).toFixed(1)}" stroke="#3d2a1e" stroke-width="1.2" stroke-linecap="round"/>`; }
    front += `<ellipse cx="${hx + 9}" cy="${hy + 0.8}" rx="4" ry="2.6" fill="#c79a6b"/><circle cx="${hx + 12.8}" cy="${hy + 0.6}" r="1" fill="#1a1a1a"/><circle cx="${hx + 8.6}" cy="${hy - 0.6}" r=".6" fill="#1a1a1a"/></g>`;
    fx = hx + 4; fy = hy - 14;
  }

  const defs = `<defs><linearGradient id="hillG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3d5a"/><stop offset="1" stop-color="#16253b" stop-opacity="0"/></linearGradient>
    <linearGradient id="treeG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22463a"/><stop offset="1" stop-color="#3b7759"/></linearGradient>
    <linearGradient id="fadeG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".18" stop-color="#fff"/><stop offset=".82" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="winGlow"><stop offset="0" stop-color="#ffcf73" stop-opacity=".35"/><stop offset="1" stop-color="#ffcf73" stop-opacity="0"/></radialGradient>
    <pattern id="plankG" width="30" height="2.4" patternUnits="userSpaceOnUse"><rect width="30" height="1.2" fill="#000" opacity=".25"/></pattern>
    <mask id="fadeM"><rect width="240" height="172" fill="url(#fadeG)"/></mask></defs>`;
  s.vb = vb;
  return defs + `<g mask="url(#fadeM)">${ground}</g>` + back + mid + front + (fx != null ? sparkle(fx, fy, k) : "");
}

function paintScene(date, sinceText) {
  const s = sceneState(date);
  $("tree").innerHTML = drawScene(s);
  $("tree").setAttribute("viewBox", s.vb.map(v => v.toFixed(1)).join(" "));
  $("sceneCap").innerHTML = (s.phase === "empty" ? "" : `<span class="scene-day">Today</span>`) + sceneCaption(s);
  $("sceneSince").textContent = sinceText || "";
}
function renderScene(now) {
  let last = null;
  if (!PREVIEW) { try { last = localStorage.getItem("xmas-tree-seen"); localStorage.setItem("xmas-tree-seen", ymd(now)); } catch (e) {} }
  const missed = last ? dayDiff(new Date(last + "T12:00:00"), now) : 0;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (missed >= 2 && missed <= 40 && !reduce) {
    let k = missed - 1;
    const step = () => {
      const d = new Date(now); d.setDate(d.getDate() - k);
      paintScene(d, k ? "Catching up…" : missed + " new days since your last visit");
      if (k-- > 0) setTimeout(step, 420);
    };
    step();
  } else paintScene(now, missed >= 2 ? missed + " new days since your last visit" : "");
}

const pad = n => String(n).padStart(2, "0");
let lastDay = -1;
function tick() {
  const now = getNow();
  const t = target(now);
  // Wall-clock difference: ignore DST shifts so the hours match the clock
  const wall = x => Date.UTC(x.getFullYear(), x.getMonth(), x.getDate(), x.getHours(), x.getMinutes(), x.getSeconds(), x.getMilliseconds());
  const diff = wall(t) - wall(now);
  const app = $("app");

  if (diff <= 0) {
    app.classList.add("celebrate");
    $("title").innerHTML = "<em>" + CONFIG.celebrateTitle + "</em>";
    $("clock").style.display = "none";
    $("noteTitle").textContent = "Julafton";
    $("noteText").textContent = CONFIG.celebrateText;
  } else {
    app.classList.remove("celebrate");
    $("clock").style.display = "";
    const s = Math.floor(diff / 1000);
    $("d").textContent = Math.floor(s / 86400);
    $("h").textContent = pad(Math.floor(s / 3600) % 24);
    $("m").textContent = pad(Math.floor(s / 60) % 60);
    $("s").textContent = pad(s % 60);
  }

  if (now.getDate() !== lastDay) {
    lastDay = now.getDate();
    renderCandles(now);
    renderScene(now);
    if (diff > 0) renderNote(now);
  }
}
tick();
setInterval(tick, 1000);

/* ---------- Snow ---------- */
(() => {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cv = $("snow"), ctx = cv.getContext("2d");
  let W, H, flakes = [];
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round(Math.min(160, W * H / 9000));
    flakes = Array.from({ length: count }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: 0.8 + Math.random() * 2.4,
      v: 0.3 + Math.random() * 0.9,
      w: Math.random() * Math.PI * 2,
      o: 0.35 + Math.random() * 0.55
    }));
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const f of flakes) {
      f.y += f.v; f.w += 0.01; f.x += Math.sin(f.w) * 0.35;
      if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255," + f.o + ")";
      ctx.fill();
    }
    if (!reduce) requestAnimationFrame(draw);
  }
  window.addEventListener("resize", resize);
  resize(); draw();
})();
</script>
